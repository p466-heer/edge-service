
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edge-service
  template:
    metadata:
      labels:
        app: edge-service
    spec:
      containers:
        - name: keycloak-proxy
          image: alpine/socat:1.8.0.3
          imagePullPolicy: IfNotPresent
          args:
            - TCP-LISTEN:8080,fork,reuseaddr,bind=127.0.0.1
            - TCP:host.minikube.internal:8080

        - name: edge-service
          image: ghcr.io/p466-heer/edge-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 9000
          env:
            - name: CATALOG_SERVICE_URL
              value: http://catalog-service:9001
            - name: SPRING_DATA_REDIS_HOST
              value: polar-redis
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - sleep 5
